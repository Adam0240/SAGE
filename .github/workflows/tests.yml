name: SAGE tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit-and-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require tests from every expected module
        # Collection imports integration tests without connecting to PostgreSQL.
        run: python -m pytest --collect-only --check-collection -q
      - name: Run unit and UI tests
        run: python -m pytest tests/ui tests/unit -q
      - name: Scan Python dependencies for vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Analyze Python code quality
        run: |
          python -m pip install ruff==0.17.5
          python -m ruff check main.py services sage_apps --select E4,E7,E9,F,I --output-format=concise
      - name: Build and package SAGE
        shell: pwsh
        run: |
          python -m compileall -q main.py login_dialog.py services sage_apps database TouchControls

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $files = @(
            "main.py",
            "login_dialog.py",
            "README.md",
            "requirements.txt",
            "requirements-speech.txt",
            ".env.example",
            "compose.yaml",
            "alembic.ini",
            "services",
            "sage_apps",
            "database",
            "migrations",
            "STEAM_Tutorials",
            "TouchControls",
            "resources"
          )

          Compress-Archive -Path $files -DestinationPath "dist/SAGE-${{ github.sha }}.zip" -Force
      - name: Upload SAGE build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGE-package
          path: dist/SAGE-*.zip
          if-no-files-found: error

  publish-release:
    name: Publish SAGE release
    needs: unit-and-ui
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download successful SAGE build
        uses: actions/download-artifact@v4
        with:
          name: SAGE-package
          path: dist

      - name: Publish SAGE pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/SAGE-*.zip \
            --target "${{ github.sha }}" \
            --title "SAGE Automated Build #${{ github.run_number }}" \
            --notes "Automated SAGE build. Requires Python and project dependencies." \
            --prerelease