name: SAGE tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit-and-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require tests from every expected module
        # Collection imports integration tests without connecting to PostgreSQL.
        run: python -m pytest --collect-only --check-collection -q
      - name: Run unit and UI tests
        run: python -m pytest tests/unit tests/ui -q
