name: SAGE tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit-and-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-speech.txt
      - name: Check installed speech stack without opening devices or downloading models
        run: |
          python -m pip check
          python -c "import sounddevice, faster_whisper, ctranslate2, av, onnxruntime, tokenizers"
      - name: Require tests from every expected module
        # Collection imports integration tests without connecting to PostgreSQL.
        run: python -m pytest --collect-only --check-collection -q
      - name: Run unit and UI tests
        run: python -m pytest tests/ui tests/unit -q
      - name: Scan Python dependencies for vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt -r requirements-speech.txt --progress-spinner off
      - name: Analyze Python code quality
        run: |
          python -m pip install ruff==0.17.5
          python -m ruff check main.py login_dialog.py services sage_apps database TouchControls migrations tests --select E4,E7,E9,F,I --output-format=concise
      - name: Build and package SAGE
        shell: pwsh
        run: |
          python -m compileall -q main.py login_dialog.py services sage_apps database TouchControls

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $files = @(
            "main.py",
            "login_dialog.py",
            "README.md",
            "requirements.txt",
            "requirements-speech.txt",
            ".env.example",
            "compose.yaml",
            "alembic.ini",
            "services",
            "sage_apps",
            "database",
            "migrations",
            "STEAM_Tutorials",
            "TouchControls",
            "resources"
          )

          Compress-Archive -Path $files -DestinationPath "dist/SAGE-${{ github.sha }}.zip" -Force
      - name: Upload SAGE build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGE-package
          path: dist/SAGE-*.zip
          if-no-files-found: error

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sage_test
          POSTGRES_USER: sage_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage_test -d sage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SAGE_TEST_DATABASE_URL: postgresql+psycopg://sage_test:isolated-ci-only@127.0.0.1:5432/sage_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install database test dependencies
        run: python -m pip install alembic==1.20.0 SQLAlchemy==2.0.54 psycopg[binary]==3.3.6 argon2-cffi==25.1.0 python-dotenv==1.2.4 pytest==9.1.1
      - name: Migrate empty database, check schema drift, and run transaction/concurrency tests
        run: python -m pytest tests/integration -q

  publish-release:
    name: Publish SAGE release
    needs: [unit-and-ui, postgres-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download successful SAGE build
        uses: actions/download-artifact@v4
        with:
          name: SAGE-package
          path: dist

      - name: Publish SAGE pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/SAGE-*.zip \
            --target "${{ github.sha }}" \
            --title "SAGE Automated Build #${{ github.run_number }}" \
            --notes "Automated SAGE build. Requires Python and project dependencies." \
            --prerelease
